# Non-secret Cloud Run settings for the public engine (gcloud --env-vars-file).
# Secrets (API keys, MS_* and SNAPSHOT_SIGNING_KEY) are added in the Cloud Run
# console only, never in this file.
CORS_ORIGINS: "https://accessindia.nl,https://www.accessindia.nl"
ENABLE_INTERNAL: "false"
PUBLISH_REFERENCE_SCORES: "true"
MAIL_PROVIDER: "graph"
REPORT_SENDER: "accessindia@airopa.co"
MAIL_NOTIFY: "accessindia@airopa.co"
PUBLIC_SITE_URL: "https://accessindia.nl/engines/india-market-assessment/"
STORE_BACKEND: "firestore"
