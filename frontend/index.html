<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Self-hosted on accessindia.nl, like the rest of the site: no visitor data goes to Google. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>India Market Assessment · Access India Netherlands</title>
    <meta
      name="description"
      content="Is India a market for what you sell? Enter your company website and see, from public sources, how India's demand, policy and route to market fit your business, and where you stand in India today. Free. PDF report in your inbox."
    />
    <meta name="theme-color" content="#18191E" />
    <script src="/consent.js" defer></script>
</head>
  <body>
    <!-- Netlify Forms detects this static copy at deploy time; the page posts to it so
         Netlify keeps a copy of every lead, as on the GCC Business Case engine. -->
    <form name="india-market-assessment-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="email_type" />
      <input name="company" /><input name="role" /><input name="call_partner" />
      <input name="domain" /><input name="snapshot_link" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
